name: Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true

      - name: Verify Docker
        run: docker compose version

      - name: Prepare environment
        run: |
          cp .env.example .env || true

      - name: Download dependencies
        run: go mod download

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: make swagger

      - name: Run tests
        run: make test
        env:
          DATABASE_URL_LOCALHOST: postgres://postgres:postgres@localhost:5433/eventtracker_test?sslmode=disable

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v